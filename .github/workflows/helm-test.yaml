name: Test Helm charts

on:
  pull_request:

permissions:
  contents: read

jobs:
  httproute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint and render HTTPRoute example
        run: |
          helm lint charts/hlib/examples/httproute
          helm template test charts/hlib/examples/httproute \
            --show-only templates/httproute.yaml > /tmp/default-httproute.yaml
          grep -Eq '^[[:space:]]*-?[[:space:]]*backendRefs:' /tmp/default-httproute.yaml

      - name: Validate redirect-only rule
        run: |
          helm template test charts/hlib/examples/httproute \
            --show-only templates/httproute.yaml \
            --values tests/httproute/redirect-values.yaml > /tmp/redirect-httproute.yaml
          if grep -Eq '^[[:space:]]*-?[[:space:]]*backendRefs:' /tmp/redirect-httproute.yaml; then
            echo 'redirect-only rule unexpectedly contains backendRefs'
            exit 1
          fi

      - name: Validate catch-all access instructions
        run: |
          helm install test charts/hlib/examples/httproute \
            --dry-run=client \
            --values tests/httproute/catchall-values.yaml > /tmp/catchall-install.txt
          grep -q 'https://app.example.com/' /tmp/catchall-install.txt
